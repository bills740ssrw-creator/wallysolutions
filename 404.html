<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Wally Solutions</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="nav" id="nav">
      <div class="nav__inner">
        <a class="brand" href="index.html" aria-label="Wally Solutions, home">
          <span class="brand__name">Wally</span>
          <span class="brand__sub">Solutions</span>
        </a>

        <nav class="nav__links" id="nav-menu" aria-label="Primary">
          <a href="index.html#work">Work</a>
          <a href="index.html#services">Services</a>
          <a href="index.html#team">Team</a>
          <a href="index.html#products">Products</a>
          <a class="btn btn--sm" href="index.html#contact">Start a project</a>
        </nav>

        <button
          class="nav__toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
          aria-label="Open menu"
        >
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main id="main">
      <section class="notfound">
        <div class="wrap">
          <p class="notfound__code">404</p>
          <h1 class="notfound__title">This page does not exist.</h1>
          <p class="notfound__text">
            The link may be old, or the address may have a typo in it. The work is a better place to
            start.
          </p>
          <div class="notfound__cta">
            <a class="btn" href="index.html">Back to the site</a>
          </div>
        </div>
      </section>
    </main>

    <div class="closing">
      <footer class="footer">
        <div class="wrap">
          <div class="footer__bottom" style="margin-top: 0; border-top: 0">
            <p>&copy; 2026 Wally Solutions. All rights reserved.</p>
            <p>Built in-house.</p>
          </div>
        </div>
      </footer>
    </div>

    
    <script>window.addEventListener("load",function(){if(!document.querySelector("[data-reveal].is-in")){document.querySelectorAll("[data-reveal]").forEach(function(e){e.classList.add("is-in")})}});</script>
      <script src="assets/js/main.js" defer></script>
  </body>
</html>
